<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Menu de inicio</title>
    <style type="text/css">
        body {
            margin: 0;
            padding: 0;
            background: #1f1f1f;
            font-family: Boulder;
        }

        .contenedor-menu {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .tarjeta-menu {
            width: 680px;
            min-height: 400px;
            background: #f3f3f3;
            border-radius: 22px;
            padding: 18px 18px 28px 18px;
            box-sizing: border-box;
        }

        .titulo-menu {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #111111;
            margin-bottom: 60px;
        }

        .grid-botones {
            display: grid;
            grid-template-columns: 1fr 1fr;
            column-gap: 14px;
            row-gap: 70px;
            justify-items: center;
            align-items: center;
        }

        .boton-menu {
            width: 300px !important;
            height: 50px !important;
            background: #000000 !important;
            border: none !important;
            border-radius: 14px !important;
            color: white !important;
            font-size: 18px !important;
            font-weight: bold !important;
            box-shadow: none !important;
        }

        .boton-menu:hover {
            background: #111111 !important;
        }
    </style>
</h:head>

<h:body>
    <div class="contenedor-menu">
        <div class="tarjeta-menu">
            <h:form id="formMenu">
                <div class="titulo-menu">Menu de inicio</div>

                <div class="grid-botones">
                    <p:commandButton value="Registrar profesor"
                                     action="registrarProfesor.xhtml?faces-redirect=true"
                                     ajax="false"
                                     styleClass="boton-menu" />

                    <p:commandButton value="Registrar unidad de aprendizaje"
                                     action="registrarUnidad.xhtml?faces-redirect=true"
                                     ajax="false"
                                     styleClass="boton-menu" />

                    <p:commandButton value="Asignar unidades de aprendizaje"
                                     action="asignarUnidades.xhtml?faces-redirect=true"
                                     ajax="false"
                                     styleClass="boton-menu" />

                    <p:commandButton value="Consultar asignaciones"
                                     action="consultarAsignaciones.xhtml?faces-redirect=true"
                                     ajax="false"
                                     styleClass="boton-menu" />
                </div>
            </h:form>
        </div>
    </div>
</h:body>
</html>
